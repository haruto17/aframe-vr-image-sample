<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>aframe-vr-image-sample</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="my-image" src="./assets/images/alpine-peaks.jpeg" />
      </a-assets>

      <a-image
        src="#my-image"
        width="2"
        height="2"
        position="0 1.6 -3"
      ></a-image>
    </a-scene>
  </body>
</html>
